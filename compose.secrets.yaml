# Create the four files locally or mount them from your secret manager.
# Never commit secrets/. DATABASE_URL must use the password in postgres_password.
services:
  db:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
  api:
    environment:
      APP_MODE: live
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET: !reset null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DOCTOR_PASSWORD_HASH: !reset null
      DOCTOR_PASSWORD_HASH_FILE: /run/secrets/doctor_password_hash
      OPENAI_API_KEY: !reset null
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - database_url
      - jwt_secret
      - doctor_password_hash
      - openai_api_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  doctor_password_hash:
    file: ./secrets/doctor_password_hash
  openai_api_key:
    file: ./secrets/openai_api_key
