# Use with: docker compose -f compose.yaml -f compose.tls.yaml up -d --build
# TLS_CERT_DIR must contain fullchain.pem and privkey.pem.
services:
  web:
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to your certificate directory}:/etc/nginx/tls:ro
