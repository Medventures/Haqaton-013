name: medhub

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medhub
      POSTGRES_USER: medhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medhub-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhub -d medhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_MODE: ${APP_MODE:-demo}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      DATABASE_URL: postgresql+psycopg://medhub:${POSTGRES_PASSWORD:-medhub-local-demo}@db:5432/medhub
      JWT_SECRET: ${JWT_SECRET:-}
      DOCTOR_USERNAME: ${DOCTOR_USERNAME:-doctor}
      DOCTOR_PASSWORD_HASH: ${DOCTOR_PASSWORD_HASH:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      AUDIO_STORAGE_DIR: /app/storage/audio
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-7}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      HF_HOME: /app/storage/models
      TEMPLATES_DIR: /app/templates
      DIAGNOSES_CSV: /app/seed/ref_disability_diagnoses_202609301227.csv
      DISEASES_JSON: /app/diseases.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    volumes:
      - app_storage:/app/storage
      - ./templates:/app/templates:ro
      - ./seed:/app/seed:ro
      - ./diseases.json:/app/diseases.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
