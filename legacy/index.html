<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8"/>
        <link rel="icon" href="./favicon.ico"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <meta name="theme-color" content="#1976d2"/>
        <meta name="description" content="Medical Speech Transcription Desktop Application"/>
        <link rel="apple-touch-icon" href="./logo192.png"/>
        <link rel="manifest" href="./manifest.json"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <title>Medical Transcription</title>
        <style>
            body {
                margin: 0;
                font-family: Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background-color: #f5f5f5;
            }
            #loading {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #667eea 0, #764ba2 100%);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                color: #fff;
            }
            #loading .logo {
                font-size: 3rem;
                margin-bottom: 1rem;
            }
            #loading .title {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: .5rem;
            }
            #loading .subtitle {
                font-size: 1rem;
                opacity: .8;
                margin-bottom: 2rem;
            }
            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(255,255,255,.3);
                border-top: 4px solid #fff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% { transform: rotate(0) }
                100% { transform: rotate(360deg) }
            }
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: #f1f1f1;
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb {
                background: #c1c1c1;
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #a8a8a8;
            }
        </style>
        <script defer="defer" src="D:\MEDIX\medical-transcription-app\src\electron\main.js"></script>
    </head>
    <body>
        <noscript>Вам необходимо включить JavaScript для работы этого приложения.</noscript>
        <div id="loading">
            <div class="logo">🏥</div>
            <div class="title">Medical Transcription</div>
            <div class="subtitle">Загрузка приложения...</div>
            <div class="spinner"></div>
        </div>
        <div id="root"></div>
        <script>
            window.addEventListener("load", function() {
                setTimeout(function() {
                    const t = document.getElementById("loading");
                    if (t) {
                        t.style.opacity = "0";
                        t.style.transition = "opacity 0.5s ease-out";
                        setTimeout(function() {
                            t.style.display = "none";
                        }, 500);
                    }
                }, 1000);
            });
        </script>
    </body>
</html>
